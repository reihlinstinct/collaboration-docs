name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  docs-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Scan for personal data and secrets
        run: |
          set -u
          files=$(git ls-files '*.md' '*.yml')
          fail=0
          check() { # label regex
            if grep -nEI "$2" $files | grep -vE 'example\.invalid|reihlinstinct|users\.noreply'; then
              echo "::error::possible $1 found"; fail=1; fi
          }
          check "email address" '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'
          check "phone-like number" '(\+?[0-9]{1,3}[ -])?[0-9]{2,3}[ -][0-9]{3}[ -][0-9]{3,4}'
          check "long ID-like number" '[0-9]{8,}'
          check "token" '(ghp_|github_pat_|xox[bp]-|AKIA)[A-Za-z0-9_]{10,}'
          check "private key" 'BEGIN [A-Z ]*PRIVATE KEY'
          exit $fail
      - name: Check relative links
        run: |
          fail=0
          for f in $(git ls-files '*.md'); do
            d=$(dirname "$f")
            for l in $(grep -oE '\]\(([^)#:]+)\)' "$f" | sed -E 's/^\]\(|\)$//g'); do
              [ -e "$d/$l" ] || { echo "::error file=$f::broken link $l"; fail=1; }
            done
          done
          exit $fail
